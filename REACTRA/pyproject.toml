[tool.ruff]
line-length = 100
exclude = ["tests/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["rectra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[project]
name = "reactra"
version = "0.1.0"
requires-python = ">=3.10"

